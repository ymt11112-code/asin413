        function parseFullBackupData(rows) {
            if (!rows || rows.length < 3) { // Header, Date, Category
                throw new Error("鞈??澆?銝??湛??喳??閬??急??准??????);
            }
            
            const backupHeaders = rows[0];
            const dates = rows[1];
            const categories = rows[2];
            
            const newAssignments = backupHeaders.slice(3).map((name, index) => ({
                id: Date.now() + Math.random() + index,
                name: name || `雿平${index+1}`,
                date: (dates[index + 3] && !isNaN(new Date(dates[index + 3]))) ? new Date(dates[index + 3]).toISOString() : new Date().toISOString(),
                category: categories[index + 3] || autoCategorize(name)
            }));

            const studentRows = rows.slice(3);
            const newStudents = studentRows.map((row, index) => {
                const statuses = {};
                newAssignments.forEach((assignment, i) => {
                    const status = row[i + 3];
                    if (STATUSES.includes(status)) {
                        statuses[assignment.id] = status;
                    }
                });
                return {
                    id: index,
                    number: row[0],
                    name: row[1],
                    group: row[2],
                    statuses: statuses
                };
            }).filter(s => s.name && s.name.trim() !== '');

            if (newStudents.length === 0 && studentRows.length > 0) {
                throw new Error("?曆??唳???摮貊?鞈?嚗?瑼Ｘ憪?甈?衣蝛箝?);

        function autoCategorize(name) {
            if (/?隤蝧?|??|?梯?|??|?|雿?/.test(name)) return '??';

            if (/?舐窗蝪糕?舐窗??.test(name)) return '?舐窗蝪?;
            if (/?單?|??.test(name)) return '?單?';
            if (/蝷暹?/.test(name)) return '蝷暹?';
            return '?嗡?';
        }

        function customGroupSort(a, b) {
            const groupSortOrder = {
                '銝': 1, '鈭?: 2, '銝?: 3, '??: 4, '鈭?: 5,
                '??: 6, '銝?: 7, '??: 8, '銋?: 9, '??: 10
            };
            const valA = groupSortOrder[a];
            const valB = groupSortOrder[b];

            if (valA !== undefined && valB !== undefined) {
                return valA - valB;
            }
            if (valA !== undefined) return -1;
            if (valB !== undefined) return 1;

            return a.localeCompare(b, undefined, { numeric: true });
        }

        function groupAssignmentsForPersonalStatus(assignments) {
            if (!assignments || assignments.length === 0) return '??;

            const grouped = assignments.reduce((acc, assignment) => {
                const originalName = assignment.name;
                // Improved regex to find a base name (non-numeric, non-special characters at the beginning)
                const match = originalName.match(/^([^\d\sLP.\/]+)/);
                let base = (match ? match[0] : originalName).trim();
                let part = (match ? originalName.substring(base.length) : '').trim();

                if (base === "M蝧?) base = "?貊?";
                if (base === "M??) base = "?賊?";

                // If part is empty, it means the whole name was the base.
                // This is correct for names like "?單?蝪?.
                if (!part) { 
                    base = originalName;
                }

                if (!acc[base]) acc[base] = [];
                
                // Push the part, but only if it's not empty. If it's empty, we've already captured the full name as the base.
                if (part) acc[base].push(part);
                return acc;
            }, {});

            return Object.entries(grouped).map(([baseName, parts], index) => {
                // If there were no parts, it means the baseName is the full name.
                if (parts.length === 0) {
                    return `<div>${index + 1}. ${baseName}</div>`;
                }
                const uniqueParts = [...new Set(parts)];
                return `<div>${index + 1}. ${baseName} ${uniqueParts.join('??)}</div>`;
            }).join('');
        }

        // ?? 撠???鞈?憟??appState嚗?券?頛荔???
        function applyPointsRows(rows) {
            if (!rows || !Array.isArray(rows) || rows.length < 2) return false;
            const header = rows[0].map(h => String(h).trim());
            const iName    = header.indexOf('憪?');
            const iDate    = header.indexOf('?交?');
            const iTime    = header.indexOf('??');
            const iSource  = header.indexOf('靘?');
            const iType    = header.indexOf('憿?');
            const iDelta   = header.indexOf('敺?');
            const iNote    = header.indexOf('?酉');
            if (iName === -1 || iDelta === -1) return false;

            const logByName = {};
            rows.slice(1).forEach(row => {
                const name = String(row[iName] || '').trim();
                if (!name) return;
                if (!logByName[name]) logByName[name] = [];
                const delta = parseFloat(row[iDelta]);
                logByName[name].push({
                    date:   iDate   >= 0 ? String(row[iDate]   || '') : '',
                    time:   iTime   >= 0 ? String(row[iTime]   || '') : '',
                    source: iSource >= 0 ? String(row[iSource] || '') : '',
                    type:   iType   >= 0 ? String(row[iType]   || '') : '',
                    delta:  isNaN(delta) ? 0 : delta,
                    note:   iNote   >= 0 ? String(row[iNote]   || '') : ''
                });
            });

            let changed = false;
            appState.students.forEach(st => {
                const name = (st.name || '').trim();
                if (logByName[name]) {
                    ensureStudentPoints(st);
                    st.points.log = logByName[name];
                    st.points.onTime    = logByName[name].reduce((s,e) => e.type === 'onTime'    ? s + e.delta : s, 0);
                    st.points.corrected = logByName[name].reduce((s,e) => e.type === 'corrected' ? s + e.delta : s, 0);
                    changed = true;
                }
            });
            return changed;
        }

        // 閫?? CSV 鞈?
        function parseCSV(csvText) {
            const lines = csvText.split('\n');
            const rows = [];
            
            for (let line of lines) {
                if (line.trim()) {
                    // 蝪∪??CSV 閫??嚗???撘??抒???嚗?
                    const cells = line.split(',').map(cell => cell.trim().replace(/^"|"$/g, ''));
                    rows.push(cells);
                }
            }
            
            return rows;
        }
        
        // 閫?? HTML 銵冽
        function parseHTMLTable(htmlText) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');
            const tables = doc.querySelectorAll('table');
            
            if (tables.length === 0) {
                return [];
            }
            
            const table = tables[0]; // 雿輻蝚砌??”??
            const rows = [];
            const trElements = table.querySelectorAll('tr');
            
            for (let tr of trElements) {
                const cells = [];
                const tdElements = tr.querySelectorAll('td, th');
                
                for (let td of tdElements) {
                    cells.push(td.textContent.trim());
                }
                
                if (cells.length > 0) {
                    rows.push(cells);
                }
            }
            
            return rows;
        }

            const defaultUrl = 'https://docs.google.com/spreadsheets/d/1ycaFHWU-qIniB2w2giVL6cwaYiYftkMmquUCp0Xk5sY/edit?gid=0#gid=0';

            const data = getExportableArray();

        function ensureStudentPoints(student) {
            if (!student.points) student.points = { onTime: 0, corrected: 0, log: [] };
            if (!student.points.log) student.points.log = [];
        }

        function todayDateStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function nowTimeStr() {
            const d = new Date();
            return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        function logPointEntry(student, type, delta, source, note) {
            ensureStudentPoints(student);
            const entry = { date: todayDateStr(), time: nowTimeStr(), type, delta };
            if (source) entry.source = source; // 'auto' | 'manual'
            if (note)   entry.note   = note;
            student.points.log.push(entry);
        }

        function logNoteEntry(student, type, source, note) {
            // Records a zero-delta note entry (no points, just a memo)
            ensureStudentPoints(student);
            student.points.log.push({ date: todayDateStr(), time: nowTimeStr(), type, delta: 0, source, note });
        }

        function calcTotalFromLog(student, fromStr, toStr) {
            ensureStudentPoints(student);
            const s = getPointSettings();
            if (!fromStr && !toStr) {
                // Full total from counters (fast path)
                return student.points.onTime * s.onTimeScore + student.points.corrected * s.correctedScore;
            }
            const from = fromStr ? new Date(fromStr) : null;
            const to   = toStr   ? new Date(toStr)   : null;
            if (to) to.setHours(23,59,59,999);
            let onTime = 0, corrected = 0;
            student.points.log.forEach(e => {
                const d = new Date(e.date);
                if (from && d < from) return;
                if (to   && d > to)   return;
                if (e.type === 'onTime')    onTime    += e.delta;
                if (e.type === 'corrected') corrected += e.delta;
            });
            return Math.max(0, onTime) * s.onTimeScore + Math.max(0, corrected) * s.correctedScore;
        }

        function calcTotal(student) {
            return calcTotalFromLog(student, null, null);
        }

                if (missedAssignments.length === 0) {

                    logPointEntry(student, 'onTime', 1, 'auto');
                    n++;
                } else {

                    noted++;

            });

            if (!silent) alert(`撌脩 ${n} 雿蝜喳飛?????漱雿平??嚗?{noted > 0 ? `\n?行? ${noted} 雿?摮貊撩鈭文歇閮??酉? : ''}`);

        // Points range state
        let pointsRangeMode = 'week'; // 'month' | 'week' | 'all' | 'custom' | 'day'
        let pointsRangeFrom = null;
        let pointsRangeTo   = null;
        let pointsRangeDay  = null; // for 'day' mode
        let pointsChampWeekOffset  = 0; // 0=current week, -1=last week, etc.
        let pointsChampMonthOffset = 0; // 0=current month

        // Compute Mon?ri dates for a given week offset from today's week
        function getWeekRange(offset) {
            const now = new Date();
            const day = now.getDay();
            const mon = new Date(now);
            mon.setDate(now.getDate() - ((day + 6) % 7) + offset * 7);
            mon.setHours(0,0,0,0);
            const fri = new Date(mon); fri.setDate(mon.getDate() + 4); // Mon+4 = Fri
            return { from: mon.toISOString().slice(0,10), to: fri.toISOString().slice(0,10) };
        }

        function getMonthRange(offset) {
            const now = new Date();
            const y = now.getFullYear(), m = now.getMonth() + offset;
            const first = new Date(y, m, 1);
            const last  = new Date(y, m + 1, 0);
            return {
                from: first.toISOString().slice(0,10),
                to:   last.toISOString().slice(0,10)
            };
        }

        function getPointsRangeDates() {
            if (pointsRangeMode === 'all')    return { from: null, to: null };
            if (pointsRangeMode === 'custom') return { from: pointsRangeFrom, to: pointsRangeTo };
            if (pointsRangeMode === 'week')   return getSemesterWeekRange(pointsChampWeekOffset);
            if (pointsRangeMode === 'month')  return getMonthRange(pointsChampMonthOffset);
            if (pointsRangeMode === 'day')    return { from: pointsRangeDay, to: pointsRangeDay };
            return { from: null, to: null };
        }

        // ---- Semester week helpers ----
        // Returns absolute Monday date for semester week N (1-based)
        function getSemesterWeekMonday(weekNum) {
            const base = new Date(appState.semesterStartDate || '2026-02-23');
            // base should already be a Monday; ensure it
            const baseDay = base.getDay(); // 0=Sun
            if (baseDay !== 1) base.setDate(base.getDate() - ((baseDay + 6) % 7)); // snap to Mon
            const mon = new Date(base);
            mon.setDate(base.getDate() + (weekNum - 1) * 7);
            return mon;
        }

        // Returns {from, to} (Mon?ri) for semester week N
        function getSemesterWeekRange(weekNum) {
            const mon = getSemesterWeekMonday(weekNum);
            const fri = new Date(mon); fri.setDate(mon.getDate() + 4);
            return { from: mon.toISOString().slice(0,10), to: fri.toISOString().slice(0,10) };
        }

        // Returns current semester week number (based on today)
        function getCurrentSemesterWeek() {
            const base = new Date(appState.semesterStartDate || '2026-02-23');
            const baseDay = base.getDay();
            if (baseDay !== 1) base.setDate(base.getDate() - ((baseDay + 6) % 7));
            base.setHours(0,0,0,0);
            const now = new Date(); now.setHours(0,0,0,0);
            const diff = now - base;
            return Math.max(1, Math.floor(diff / (7 * 86400000)) + 1);
        }

            for (let w = 1; w <= endWeek; w++) {
                const { from, to } = getSemesterWeekRange(w);
                const fD = new Date(from), tD = new Date(to);

                opt.value = w;

                if (w === pointsChampWeekOffset) opt.selected = true;
                sel.appendChild(opt);

            // Returns top-3 tiers [{names, total}] for the given date range
            const ranked = appState.students.map(st => {
                ensureStudentPoints(st);
                return { number: st.number || '', name: st.name || '', total: calcTotalFromLog(st, from, to) };
            }).filter(s => s.total > 0).sort((a, b) => b.total - a.total);
            if (ranked.length === 0) return [];
            // Group into score tiers, pick top 3 distinct scores
            const tiers = [];
            let lastScore = null;
            for (const s of ranked) {
                if (s.total !== lastScore) {
                    if (tiers.length === 3) break;
                    tiers.push({ entries: [], total: s.total });
                    lastScore = s.total;
                }
                tiers[tiers.length - 1].entries.push(s);
            }
            // Build display label: if >3 in tier, show only numbers
            return tiers.map(t => ({
                total: t.total,
                label: t.entries.length > 3
                    ? t.entries.map(e => e.number).join('??)
                    : t.entries.map(e => `${e.number} ${e.name}`.trim()).join('??)
            })); // array of up to 3: [{label, total}]
        }

        function renderChampHistory() {
            const content = document.getElementById('champ-history-content');
            if (!content) return;
            const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;

            // Build week rows W1?ndWeek
            const weekRows = [];
            const endWeek = appState.semesterEndWeek || 21;
            for (let w = 1; w <= endWeek; w++) {
                const { from, to } = getSemesterWeekRange(w);
                const fD = new Date(from), tD = new Date(to);
                const label = `蝚?{w}??(${fmt(fD)}??{fmt(tD)})`;
                const champ = computeChampForRange(from, to);
                weekRows.push({ label, champ });
            }

            // Build month rows for this semester (Feb?un of current year)
            const monthRows = [];
            const now = new Date();
            const semMonths = [];
            // Months from semester start month to current month+1 (W20 ends ~Jun)
            for (let m = 1; m <= 6; m++) {
                const first = new Date(now.getFullYear(), m - 1, 1);
                const last  = new Date(now.getFullYear(), m, 0);
                const from  = first.toISOString().slice(0,10);
                const to    = last.toISOString().slice(0,10);
                const label = `${now.getFullYear()}撟?{m}?;
                const champ = computeChampForRange(from, to);
                monthRows.push({ label, champ });
            }

            // Helper: render one tier cell ??"?? (N??"
            const tierCell = (tier) => {
                if (!tier) return '<td class="py-1.5 px-2 text-gray-300 text-xs">??/td>';
                return `<td class="py-1.5 px-2 text-sm font-semibold text-violet-700">${tier.label} <span class="text-gray-400 font-normal text-xs">(${tier.total}??</span></td>`;
            };
            const renderRow = r => {
                const t = r.champ || [];
                return `<tr class="border-b last:border-0 hover:bg-gray-50">
                    <td class="py-1.5 px-2 text-xs text-gray-500 font-medium whitespace-nowrap">${r.label}</td>
                    <td class="py-1.5 px-1 text-amber-500 font-bold text-sm w-5">??</td>${tierCell(t[0])}

                    <td class="py-1.5 px-1 text-orange-400 font-bold text-sm w-5">??</td>${tierCell(t[2])}
                </tr>`;
            };
            const renderTable = (title, icon, rows) => `
                <div class="mb-5">
                    <div class="font-semibold text-gray-700 mb-2">${icon} ${title}</div>
                    <table class="w-full text-sm border-collapse">
                        <thead><tr class="text-xs text-gray-400 border-b">
                            <th class="pb-1 px-2 text-left font-medium">?望活嚗?隞?/th>
                            <th class="pb-1" colspan="2">??</th>
                            <th class="pb-1" colspan="2">鈭?</th>
                            <th class="pb-1" colspan="2">摮??</th>
                        </tr></thead>
                        <tbody>${rows.map(renderRow).join('')}</tbody>
                    </table>
                </div>`;
            content.innerHTML = renderTable(`?勗?頠?(W1?${endWeek})`, '??', weekRows) + renderTable('??頠?, '??', monthRows);
        }
